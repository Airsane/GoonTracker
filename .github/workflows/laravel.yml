name: Laravel

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

# Add permissions configuration
permissions:
  contents: write
  packages: write
  actions: write

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Run migrations
      run: php artisan migrate
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

  create-release:
    needs: laravel-tests  # Runs only if tests pass
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # Only runs on tagged releases

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Remove unnecessary files
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .git
          rm -rf .github
          rm -rf storage/*.log
          rm -rf database/*.sqlite

      - name: Create ZIP package
        run: |
          zip -r goontracker-${{ github.ref_name }}.zip . -x ".git/*" "node_modules/*" "tests/*" ".github/*"

      - name: Upload ZIP as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: goontracker-${{ github.ref_name }}
          path: goontracker-${{ github.ref_name }}.zip

      - name: Release and attach ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: goontracker-${{ github.ref_name }}.zip